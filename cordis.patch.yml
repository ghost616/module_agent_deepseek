# module-agent 插件的 dsh 加载配置（示例）。
# 使用方法：复制到 profile 目录（如 ~/.dsh/profiles/web/cordis.patch.yml），
# 并将本仓库的 package.json 连同 src/ 一并复制到 profile 目录下的 module-agent/ 子目录
# （工程自带 package.json 已含非空的 name 与 version，缺一不可）。
# 原因：若 module-agent/ 缺 package.json，dsh 的 dsh_plugin_packages 请求扩展
# （plugin-package-inventory-deepseek）会用 nearestManifest 沿模块路径上溯，
# 将最近的 package.json（此处命中 profile 的 package.json，其通常只含 name 无 version）
# 当作该插件的 owning manifest，触发 identityFromManifest 抛出
# "must declare non-empty name and version"，导致每次 DeepSeek 请求在
# extension preparation 阶段报 "DeepSeek request extension preparation failed"。
- insert:
    - id: module-agent
      name: './module-agent/src/index.ts'
      config:
        # 项目根目录兜底（agent 会话无 cwd 时作为 .module_agent 数据目录的解析根）
        dataDir: .
        # 启动力牧/皋陶/离朱/夔子智能体使用的 subagent provider，默认 'spawn'
        subagentProvider: spawn
